networks:
  iot-network:

services:

  individuals-api:
    container_name: individuals-api
    build: .
    restart: unless-stopped
    env_file:
      - path: ./default.env
        required: true
    ports:
      - ${INDIVIDUALS_API_PORT}:8082
    networks:
      - iot-network
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: keycloak/keycloak:26.4
    container_name: keycloak
    restart: unless-stopped
    command:
      - start-dev
    healthcheck:
      test: ["CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    env_file:
      - path: ./default.env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${KEYCLOAK_PORT}:8080
    networks:
      - iot-network

  postgres:
    image: postgres:18-trixie
    container_name: postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - path: ./default.env
        required: true
    ports:
      - ${POSTGRES_PORT}:5432
    networks:
      - iot-network